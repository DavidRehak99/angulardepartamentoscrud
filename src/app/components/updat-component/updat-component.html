<h1>Update Component</h1>

<form createform="ngForm" >
    <label>Id Departamento</label>
    <input type ="number" name="cajaid" #cajaid class="form-control" value="{{departamento.numero}} disabled">

    <label>Nombre</label>
    <input type ="text" name="cajaid" #cajanombre class="form-control" value="{{departamento.nombre}}" >

    <label>Localidad</label>
    <input type ="text" name="cajaid" #cajalocalidad class="form-control" value="{{departamento.localidad}}">
    <button (click)="updateDepartamento()" class="btn-info">New</button>
</form>
