<h1>Homecomponent</h1>
<style>

    .table,th,td{
        border: 1px solid grey;
    }
</style>

<table style="background-color: rgb(198, 238, 208); margin-left:50px ;">
    <thead>
    <tr>
    <th>Id Departamento</th>
    <th>Nombre</th>
    <th>Localidad</th>
    <th></th>
    </tr>
    </thead>
    <tbody>
        @for (dept of departamentos; track dept){

            <tr>
            <td>{{dept.numero}}</td>
            <td>{{dept.nombre}}</td>
            <td>{{dept.localidad}}</td>
            <td><a [routerLink]="['/details/' + dept.numero + '/' + dept.nombre + '/' + dept.localidad]" class="btn btn-light">Details</a>
            <a [routerLink]="['/update/' + dept.numero]" class="btn btn-info">Actualizar</a>
                <button class="btn btn-danger" (click)="deleteDepartamentos(dept.numero)">Delete</button>
        </td>
            </tr>

        }
    
    </tbody>
</table>
